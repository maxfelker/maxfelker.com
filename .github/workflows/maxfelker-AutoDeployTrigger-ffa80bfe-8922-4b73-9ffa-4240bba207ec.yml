name: Trigger auto deployment for maxfelker

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/maxfelker-AutoDeployTrigger-ffa80bfe-8922-4b73-9ffa-4240bba207ec.yml'

  # Allow mannually trigger 
  workflow_dispatch:      

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      - name: Log in to container registry
        uses: docker/login-action@v1
        with:
          registry: maxfelkershared.azurecr.io
          username: ${{ secrets.MAXFELKER_REGISTRY_USERNAME }}
          password: ${{ secrets.MAXFELKER_REGISTRY_PASSWORD }}

      - name: Build and push container image to registry
        uses: docker/build-push-action@v2
        with:
          push: true
          tags: maxfelkershared.azurecr.io/maxfelker:${{ github.sha }}
          file: ./Dockerfile
          context: ./


  deploy:
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.MAXFELKER_AZURE_CREDENTIALS }}


      - name: Deploy to containerapp
        uses: azure/CLI@v1
        with:
          inlineScript: |
            az config set extension.use_dynamic_install=yes_without_prompt
            az containerapp registry set -n maxfelker -g maxfelker.com --server maxfelkershared.azurecr.io --username  ${{ secrets.MAXFELKER_REGISTRY_USERNAME }} --password ${{ secrets.MAXFELKER_REGISTRY_PASSWORD }}
            az containerapp update -n maxfelker -g maxfelker.com --image maxfelkershared.azurecr.io/maxfelker:${{ github.sha }}
