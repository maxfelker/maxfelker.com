server {
  listen 80;
  server_name maxfelker.com www.maxfelker.com;
  access_log /var/log/nginx.access_log  main;

  location / {
    root /usr/share/nginx/html;
    index index.html;
    # $uri.html serves the prerendered per-article page (real OG/Twitter tags for crawlers)
    # without a trailing-slash redirect; everything else falls back to the SPA shell.
    try_files $uri $uri.html $uri/ /index.html;
  }
}

